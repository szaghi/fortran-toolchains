name: Install

# Reusable: a published release installed as its users do, on a fresh runner (the linux-bare toolchain: gcc at the
# versions.env pin, built by this repository from the GNU release, CMake, ninja, fpm; no image): the release's installer (its install.sh asset, the
# FoBiS scaffold's) installs the release with each build system the tarball carries. With the one-line installer
# (interface 2, FoBiS#217: `install.sh --version`): once per build system with FoBiS off PATH (the installer
# bootstraps it), the pkg-config files checked and --uninstall (scripts/install-check.sh), then the piped one-liner
# with its default build; with an older installer: make, cmake, fobis through it, and fpm builds the tarball's
# fpm.toml. Called by a project's release workflow after its
# release job (see release.yml):
#
#   install:
#     needs: release
#     uses: szaghi/fortran-toolchains/.github/workflows/install.yml@v1
#     with:
#       tag: ${{ github.ref_name }}
#
# The release is public when this runs: a failure flags a broken release, it cannot block it.

on:
  workflow_call:
    inputs:
      tag:
        description: the release's tag
        type: string
        required: true
      repository:
        description: the release's repository (default the caller's)
        type: string
        default: ''
      builds:
        description: auto (every build system the tarball carries), or a list of make, cmake, fobis, fpm
        type: string
        default: auto
      apt-packages:
        description: Ubuntu packages installed first (what the project's build needs beyond the toolchain)
        type: string
        default: ''
      toolchains-ref:
        description: the ref of this repository whose scripts are used; empty for the caller's checkout
        type: string
        default: v1
      toolchains-repository:
        description: this repository
        type: string
        default: szaghi/fortran-toolchains

permissions:
  contents: read

jobs:
  install:
    name: install (${{ inputs.repository || github.repository }} ${{ inputs.tag }})
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      REPO: ${{ inputs.repository || github.repository }}
      # the release's API (rate limits; a private repository's assets)
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout repository
      if: inputs.toolchains-ref == ''
      uses: actions/checkout@v7

    - name: fortran-toolchains is this checkout
      if: inputs.toolchains-ref == ''
      run: mkdir .fortran-toolchains && tar --exclude=./.fortran-toolchains -cf - . | tar -xf - -C .fortran-toolchains

    - name: Checkout fortran-toolchains
      if: inputs.toolchains-ref != ''
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.toolchains-repository }}
        ref: ${{ inputs.toolchains-ref }}
        path: .fortran-toolchains

    - name: Toolchain
      uses: ./.fortran-toolchains/.github/actions/setup-linux-bare

    - name: Packages
      if: inputs.apt-packages != ''
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      # PACKAGES is a word list
      run: |
        # shellcheck disable=SC2086
        sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $PACKAGES

    # the release's assets: its installer, and its tarball to tell which build systems it carries (older installers,
    # interface 1: the steps install.sh --build <b> and fpm build below)
    - name: The release
      id: release
      env:
        BUILDS: ${{ inputs.builds }}
      run: |
        dir=$RUNNER_TEMP/release; mkdir -p "$dir"
        api() { curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$@"; }
        api "https://api.github.com/repos/$REPO/releases/tags/$TAG" > "$dir/release.json"
        jq -r '.assets[] | select(.name == "install.sh" or (.name | endswith(".tar.gz"))) | "\(.url) \(.name)"' \
          "$dir/release.json" | while read -r url name; do
          api -H 'Accept: application/octet-stream' -o "$dir/$name" "$url"
        done
        ls -l "$dir"
        tarball=$(find "$dir" -maxdepth 1 -name '*.tar.gz' | sed -n 1p)   # not head: a SIGPIPE would fail the step
        [ -n "$tarball" ] || { echo "::error::$REPO $TAG has no tarball asset"; exit 1; }
        [ -f "$dir/install.sh" ] || { echo "::error::$REPO $TAG has no install.sh asset"; exit 1; }
        files=$(tar -tzf "$tarball" | sed -n 's%^[^/]*/\([^/]*\)$%\1%p')
        carries() {   # carries <build>: the tarball has the build system's top-level file
          case $1 in
            make) grep -qxE 'Makefile|makefile|GNUmakefile' <<< "$files" ;;
            cmake) grep -qx CMakeLists.txt <<< "$files" ;;
            fobis) grep -qx fobos <<< "$files" ;;
            fpm) grep -qx fpm.toml <<< "$files" ;;
            *) echo "::error::unknown build $1 (make, cmake, fobis, fpm)"; exit 1 ;;
          esac
        }
        legs=
        if [ "$BUILDS" = auto ]; then
          for b in make cmake fobis fpm; do if carries "$b"; then legs="$legs $b"; fi; done
        else
          for b in $BUILDS; do
            carries "$b" || { echo "::error::the $REPO $TAG tarball has no $b build file"; exit 1; }
            legs="$legs $b"
          done
        fi
        [ -n "$legs" ] || { echo "::error::no build system in the $REPO $TAG tarball"; exit 1; }
        # the installer's interface: 2 is FoBiS#217's one-liner (--version), anything else the older --download one
        installer=1; [ "$(bash "$dir/install.sh" --version 2> /dev/null | sed -n 1p)" = "install.sh 2" ] && installer=2
        echo "legs:$legs; installer interface $installer"
        { echo "legs=$legs "; echo "tarball=$tarball"; echo "installer=$installer"; } >> "$GITHUB_OUTPUT"

    # interface 2 (FoBiS#217): the one-liner, once per build system the tarball ships, with FoBiS off PATH (the
    # installer bootstraps it), the pkg-config files checked, then --uninstall (scripts/install-check.sh)
    - name: install.sh 2 --build make
      if: steps.release.outputs.installer == '2' && contains(steps.release.outputs.legs, ' make ')
      run: .fortran-toolchains/scripts/install-check.sh "$RUNNER_TEMP/release/install.sh" make "$RUNNER_TEMP/prefix-make" --tag "$TAG" --fc "$FC"

    - name: install.sh 2 --build cmake
      if: steps.release.outputs.installer == '2' && contains(steps.release.outputs.legs, ' cmake ')
      run: .fortran-toolchains/scripts/install-check.sh "$RUNNER_TEMP/release/install.sh" cmake "$RUNNER_TEMP/prefix-cmake" --tag "$TAG" --fc "$FC"

    - name: install.sh 2 --build fobis
      if: steps.release.outputs.installer == '2' && contains(steps.release.outputs.legs, ' fobis ')
      run: .fortran-toolchains/scripts/install-check.sh "$RUNNER_TEMP/release/install.sh" fobis "$RUNNER_TEMP/prefix-fobis" --tag "$TAG" --fc "$FC"

    - name: install.sh 2 --build fpm
      if: steps.release.outputs.installer == '2' && contains(steps.release.outputs.legs, ' fpm ')
      run: .fortran-toolchains/scripts/install-check.sh "$RUNNER_TEMP/release/install.sh" fpm "$RUNNER_TEMP/prefix-fpm" --tag "$TAG" --fc "$FC"

    # the one-liner as its users run it: piped from the release, no --build, no terminal: the first of fobis, fpm,
    # cmake, make that the tarball ships
    - name: the one-liner, its default build
      if: steps.release.outputs.installer == '2'
      run: |
        curl -fsSL "https://github.com/$REPO/releases/download/$TAG/install.sh" \
          | bash -s -- --tag "$TAG" --fc "$FC" --prefix "$RUNNER_TEMP/prefix-default"
        bash "$RUNNER_TEMP/release/install.sh" --uninstall --prefix "$RUNNER_TEMP/prefix-default"

    # the older installer finds its tarball through the GitHub API, anonymously (curl -s, no error check): runners
    # share their address and its 60 requests an hour, so it fails at random ("jq: Cannot iterate over null", Selftest
    # 2026-11-17/18). A curl first on PATH that authenticates the api.github.com calls; interface 2 never calls the API
    - name: An authenticated GitHub API for the older installer
      if: steps.release.outputs.installer != '2'
      run: |
        shim=$RUNNER_TEMP/api-shim; mkdir -p "$shim"
        real=$(command -v curl)
        {
          echo '#!/usr/bin/env bash'
          echo 'for a in "$@"; do case $a in https://api.github.com/*)'
          echo "  exec $real -H \"Authorization: Bearer \$GH_TOKEN\" \"\$@\" ;; esac; done"
          echo "exec $real \"\$@\""
        } > "$shim/curl"
        chmod +x "$shim/curl"
        echo "$shim" >> "$GITHUB_PATH"

    - name: install.sh --build make
      if: steps.release.outputs.installer != '2' && contains(steps.release.outputs.legs, ' make ')
      run: cd "$(mktemp -d)" && bash "$RUNNER_TEMP/release/install.sh" --repo "$REPO" --tag "$TAG" --download wget --build make

    - name: install.sh --build cmake
      if: steps.release.outputs.installer != '2' && contains(steps.release.outputs.legs, ' cmake ')
      run: cd "$(mktemp -d)" && bash "$RUNNER_TEMP/release/install.sh" --repo "$REPO" --tag "$TAG" --download wget --build cmake

    # fetches the fobos [dependencies], then builds the fobos default mode
    - name: install.sh --build fobis
      if: steps.release.outputs.installer != '2' && contains(steps.release.outputs.legs, ' fobis ')
      run: cd "$(mktemp -d)" && bash "$RUNNER_TEMP/release/install.sh" --repo "$REPO" --tag "$TAG" --download wget --build fobis

    # the tarball's fpm.toml, whatever the release's installer supports; fpm takes the compilers from FPM_*
    - name: fpm build
      if: steps.release.outputs.installer != '2' && contains(steps.release.outputs.legs, ' fpm ')
      env:
        TARBALL: ${{ steps.release.outputs.tarball }}
      run: |
        cd "$(mktemp -d)" && tar -xzf "$TARBALL" && cd ./*/
        FPM_FC=$FC FPM_CC=$CC FPM_CXX=$CXX fpm build --profile release
