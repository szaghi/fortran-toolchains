name: Build

# Builds the toolchain images and pushes them to GHCR. One job per (vendor, flavour): scripts/build.sh gives the tag
# (<vendor>-<major.minor> for the full flavour, <vendor>-<major.minor>-<flavour> for the others) and the build
# arguments (versions.env, the versions installed on the WSL box). Each image is also tagged <tag>-<date> so a project
# can pin a build. Built when a vendor directory, versions.env, scripts/build.sh or this workflow changes on main, or
# on demand. Every flavour checks itself at build time (check.f90 on 2 ranks for full): a broken image is never pushed.

on:
  push:
    branches: [main]
    paths: ['gnu/**', 'common/**', 'versions.env', 'scripts/build.sh', '.dockerignore', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.vendor }} ${{ matrix.flavour }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        vendor: [gnu]
        flavour: [lite, full, gui]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Tag and build arguments
      id: image
      env:
        REGISTRY: ghcr.io/${{ github.repository }}
      run: |
        tag=$(scripts/build.sh ${{ matrix.vendor }} ${{ matrix.flavour }} --tag)
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "dated=$tag-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
        {
          echo 'build-args<<EOF'
          scripts/build.sh ${{ matrix.vendor }} ${{ matrix.flavour }} --build-args
          echo 'JOBS=4'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build, check and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.vendor }}/Dockerfile
        target: ${{ matrix.flavour }}
        push: true
        tags: |
          ${{ steps.image.outputs.tag }}
          ${{ steps.image.outputs.dated }}
        build-args: ${{ steps.image.outputs.build-args }}
        cache-from: type=gha,scope=${{ matrix.vendor }}-${{ matrix.flavour }}
        cache-to: type=gha,mode=max,scope=${{ matrix.vendor }}-${{ matrix.flavour }}
