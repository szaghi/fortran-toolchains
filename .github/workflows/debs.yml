name: Debs

# The linux-bare toolchain's compiler packages, published as a release of this repository, so that a fresh runner
# (install.yml, contract.yml's linux-bare, selftest) never downloads them from the ubuntu-toolchain-r/test PPA on
# Launchpad: setup/linux-bare.sh takes the bundle pinned in setup/linux-bare-debs.env, the PPA only as fallback.
# Run by hand (Actions > Debs > Run workflow) when the GCC pin or the PPA's snapshot changes, then paste the three pin
# lines of the run's summary into setup/linux-bare-debs.env and commit them. A published bundle is never replaced:
# a new snapshot is a new tag.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.bundle.outputs.tag }}
      asset: ${{ steps.bundle.outputs.asset }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: The PPA's packages of the compiler
      id: bundle
      run: setup/linux-bare.sh bundle "$RUNNER_TEMP/debs"

    - name: Publish the bundle
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.bundle.outputs.tag }}
        ASSET: ${{ steps.bundle.outputs.asset }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "::error::the release $TAG exists: a bundle is never replaced (a new PPA snapshot makes a new tag)"; exit 1
        fi
        dir=$RUNNER_TEMP/debs
        gh release create "$TAG" "$dir/$ASSET" "$dir/$ASSET.sha256" "$dir"/manifest-*.txt --target "$GITHUB_SHA" \
          --prerelease --latest=false --title "linux-bare compiler packages: $TAG" \
          --notes "The ubuntu-toolchain-r/test PPA's packages of the linux-bare toolchain's compiler, for setup/linux-bare.sh (setup/linux-bare-debs.env). The manifest lists them."

  # the published bundle installed on a fresh runner with Launchpad unreachable: what a consumer's job will do
  check:
    needs: bundle
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Launchpad unreachable
      run: printf '127.0.0.1 %s\n' ppa.launchpadcontent.net ppa.launchpad.net launchpad.net api.launchpad.net | sudo tee -a /etc/hosts

    - name: The toolchain from the bundle
      env:
        LINUX_BARE_DEBS_TAG: ${{ needs.bundle.outputs.tag }}
        LINUX_BARE_DEBS_ASSET: ${{ needs.bundle.outputs.asset }}
        LINUX_BARE_DEBS_SHA256: ${{ needs.bundle.outputs.sha256 }}
      run: |
        setup/linux-bare.sh repo
        setup/linux-bare.sh install 2>&1 | tee "$RUNNER_TEMP/install.log"
        grep -q "compiler packages: the bundle $LINUX_BARE_DEBS_TAG" "$RUNNER_TEMP/install.log" \
          || { echo "::error::the toolchain did not come from the bundle"; exit 1; }

    - name: Check the contract and the versions
      run: |
        common/check-contract.sh
        common/check-versions.sh --policy major --pins versions.env GCC FPM CMAKE NINJA FOBIS
        printf 'program p\nprint *, "linux-bare gfortran ok"\nend program\n' > p.f90 && "$FC" p.f90 -o p && ./p

    - name: The pins
      env:
        TAG: ${{ needs.bundle.outputs.tag }}
        ASSET: ${{ needs.bundle.outputs.asset }}
        SHA256: ${{ needs.bundle.outputs.sha256 }}
      run: |
        { echo '### The pins of setup/linux-bare-debs.env'; echo '```'
          echo "LINUX_BARE_DEBS_TAG=$TAG"; echo "LINUX_BARE_DEBS_ASSET=$ASSET"; echo "LINUX_BARE_DEBS_SHA256=$SHA256"
          echo '```'; } >> "$GITHUB_STEP_SUMMARY"
