name: Selftest

# The reusable workflows of this repository, called on tests/fixture with this commit's actions and scripts
# (toolchains-ref: '' uses this checkout), on every toolchain they support; matrix-v1 takes the released path instead
# (the default toolchains-ref, v1), as the projects do. A reusable workflow cannot be tested before
# it is pushed: this is its gate, and the projects' callers pin a release tag (v1) once it is green.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**', 'common/**', 'setup/**', 'scripts/**', 'tests/fixture/**',
            'versions.env']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    uses: ./.github/workflows/matrix.yml
    with:
      toolchains: linux-gnu linux-nvhpc linux-oneapi macos-gnu windows-gnu
      working-directory: tests/fixture
      toolchains-ref: ''

  # the released path every project takes: toolchains-ref left at its default (v1), so the workflow checks this
  # repository out at v1 and sets the macOS and Windows toolchains up from that checkout
  matrix-v1:
    uses: ./.github/workflows/matrix.yml
    with:
      toolchains: linux-gnu macos-gnu windows-gnu
      working-directory: tests/fixture

  matrix-display:
    uses: ./.github/workflows/matrix.yml
    with:
      toolchains: linux-gnu
      script: scripts/ci/display.sh
      display: true
      working-directory: tests/fixture
      toolchains-ref: ''

  test:
    uses: ./.github/workflows/test.yml
    with:
      working-directory: tests/fixture
      pack-coverage: always
      toolchains-ref: ''

  test-coverage:
    needs: test
    runs-on: ubuntu-24.04
    steps:
    - name: The coverage output and the coverage-docs artifact
      uses: actions/download-artifact@v8
      with:
        name: coverage-docs

    - name: Check them
      env:
        PCT: ${{ needs.test.outputs.coverage }}
      run: |
        echo "coverage output: $PCT"
        [ "$PCT" = 100.0 ]
        tar -tzf coverage-docs.tgz | tee /dev/stderr | grep -qx 'docs/public/coverage.json'

  # the site of the fixture, deployed to this repository's Pages from main: the coverage from test's coverage-docs
  # artifact (this run's)
  docs:
    needs: test
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      working-directory: tests/fixture
      toolchains-ref: ''

  # the coverage run by the docs job itself, no deployment
  docs-run:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/docs.yml
    with:
      coverage: run
      deploy: false
      working-directory: tests/fixture
      toolchains-ref: ''

  docs-check:
    needs: [docs, docs-run]
    runs-on: ubuntu-24.04
    steps:
    - name: The coverage sources, the deployment
      env:
        SOURCE: ${{ needs.docs.outputs.coverage-source }}
        PCT: ${{ needs.docs.outputs.coverage }}
        DEPLOYED: ${{ needs.docs.outputs.deployed }}
        URL: ${{ needs.docs.outputs.page-url }}
        RUN_SOURCE: ${{ needs.docs-run.outputs.coverage-source }}
        RUN_PCT: ${{ needs.docs-run.outputs.coverage }}
        RUN_DEPLOYED: ${{ needs.docs-run.outputs.deployed }}
        MAIN: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        echo "docs: $PCT% from the $SOURCE, deployed $DEPLOYED ($URL); docs-run: $RUN_PCT% from the $RUN_SOURCE"
        [ "$SOURCE" = artifact ] && [ "$PCT" = 100.0 ]
        [ "$RUN_SOURCE" = run ] && [ "$RUN_PCT" = 100.0 ] && [ "$RUN_DEPLOYED" = false ]
        if [ "$MAIN" = true ]; then
          [ "$DEPLOYED" = true ] && [ -n "$URL" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL%/}/coverage.json")
          echo "coverage.json: HTTP $code"; [ "$code" = 200 ]
        else
          [ "$DEPLOYED" = false ]
        fi

  # the fixture's v1.2.3 release, not published: the tarball, the notes and the installer as the release artifact (the
  # caller grants what publishing needs, as a project's does)
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: v1.2.3
      name: fixture
      dry-run: true
      working-directory: tests/fixture
      toolchains-ref: ''

  release-check:
    needs: release
    runs-on: ubuntu-24.04
    steps:
    - name: The release artifact
      uses: actions/download-artifact@v8
      with:
        name: release

    - name: Check it
      env:
        TARBALL: ${{ needs.release.outputs.tarball }}
      run: |
        ls -l
        [ "$TARBALL" = fixture-v1.2.3.tar.gz ]
        tar -tzf "$TARBALL" > list
        grep -qx 'fixture-v1.2.3/fobos' list
        grep -qx 'fixture-v1.2.3/src/lib/fixture.F90' list
        grep -qx 'fixture-v1.2.3/docs/package.json' list
        if grep -vq '^fixture-v1.2.3/' list; then echo "an entry outside fixture-v1.2.3/"; exit 1; fi
        [ -f install.sh ]
        cat release-notes.md
        head -1 release-notes.md | grep -q '^## \[1.2.3\]'
        if grep -q '1.2.2' release-notes.md; then echo "the notes run into 1.2.2's section"; exit 1; fi

  # a real release installed as its users do: PENF's latest; not its make leg, since v2.0.1's makefile still defines the
  # R16P macro the sources renamed PENF_R16P (cpp turns the R16P kind into 1)
  install:
    uses: ./.github/workflows/install.yml
    with:
      repository: szaghi/PENF
      tag: v2.0.1
      builds: cmake fobis fpm
      toolchains-ref: ''

  generated:
    uses: ./.github/workflows/generated.yml
    with:
      command: bash scripts/docs_examples.sh
      paths: docs/examples
      working-directory: tests/fixture
      toolchains-ref: ''

  fpm:
    uses: ./.github/workflows/fpm.yml
    with:
      working-directory: tests/fixture
      toolchains-ref: ''

  fpm-oneapi:
    uses: ./.github/workflows/fpm.yml
    with:
      toolchain: linux-oneapi
      working-directory: tests/fixture
      toolchains-ref: ''
