name: Set up a fresh Linux runner
description: >-
  The linux-bare toolchain, for the jobs that must test a fresh machine rather than an image (installers): gcc, g++
  and gfortran at the exact versions.env GCC pin, built by this repository from the GNU release and published as its
  release asset (setup/linux-bare-gcc.env; gcc.yml), no PPA; cached by its release tag. CMake, ninja, fpm and FoBiS at
  their pins. Exports the environment contract and checks it: GCC exactly, the tools within their major.

runs:
  using: composite
  steps:

  - name: Base packages and the compiler's run-time libraries
    id: repo
    shell: bash
    run: '"$GITHUB_ACTION_PATH/../../../setup/linux-bare.sh" repo'

  - name: Compiler archive cache
    uses: actions/cache@v6
    with:
      path: ~/.fortran-toolchains/gcc
      key: linux-bare-gcc-${{ runner.arch }}-${{ steps.repo.outputs.gcc }}

  - name: Compiler and tools
    shell: bash
    run: '"$GITHUB_ACTION_PATH/../../../setup/linux-bare.sh" install'

  - name: Check the contract and the versions
    shell: bash
    run: |
      common="$GITHUB_ACTION_PATH/../../../common"
      pins="$GITHUB_ACTION_PATH/../../../versions.env"
      "$common/check-contract.sh"
      "$common/check-versions.sh" --pins "$pins" GCC
      "$common/check-versions.sh" --policy major --pins "$pins" FPM CMAKE NINJA FOBIS
